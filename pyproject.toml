[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "spinout-intelligence"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["httpx>=0.27,<1", "pydantic-settings>=2.2,<3", "sqlalchemy>=2,<3", "typer>=0.12,<1", "rich>=13,<14", "rapidfuzz>=3.9,<4"]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]

[project.scripts]
spinout = "spinout_intelligence.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
